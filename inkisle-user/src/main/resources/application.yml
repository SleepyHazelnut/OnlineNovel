server:
  port: 8081

spring:
  application:
    name: inkisle-user
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    openfeign:
      client:
        config:
          default:
            # 不配的话走 Feign 默认的 60 秒读超时：下游抖一下，
            # 调用方的 Tomcat 线程和数据库连接就被按在那里一分钟
            connect-timeout: 1000
            read-timeout: 3000
  datasource:
    url: jdbc:mysql://localhost:3306/inkisle?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3s

jwt:
  secret: ${JWT_SECRET:inkisle-dev-secret-key-change-me-before-release}
  expire-hours: 24

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.inkisle.entity
  configuration:
    map-underscore-to-camel-case: true

inkisle:
  # 服务间调用的共享令牌。网关不转发 /internal，但服务直接监听端口，
  # 没有令牌的话直连 808x 就能改审核状态、删审核记录
  internal:
    token: ${INTERNAL_TOKEN:}