server:
  port: 8080

spring:
  application:
    name: inkisle-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      # 只转接口前缀，写成 /** 会把 html、css 也当接口转走，静态页就打不开了
      # 按前缀分服务，order 小的先匹配。/author 下面既有写书、写章节（归 book），
      # 也有 AI 改写（还在老服务），不排顺序会走错
      routes:
        - id: book-author
          uri: lb://inkisle-book
          order: 1
          predicates:
            - Path=/author/book/**,/author/chapter/**
        - id: audit
          uri: lb://inkisle-audit
          order: 2
          predicates:
            - Path=/admin/audit/**,/admin/chapter/**
        - id: book
          uri: lb://inkisle-book
          order: 3
          predicates:
            - Path=/book/**,/bookshelf/**,/chapter/**,/category/**,/comment/**,/history/**,/home/**,/rank/**,/rating/**,/admin/book/**,/admin/category/**,/admin/comment/**,/admin/home/**
        - id: user
          uri: lb://inkisle-user
          order: 4
          predicates:
            - Path=/user/**,/sign/**,/captcha/**,/author/**,/admin/login,/admin/author/**,/admin/user/**
        - id: stat
          uri: lb://inkisle-stat
          order: 5
          predicates:
            # 数据看板，只读聚合，独立进程，不跟业务服务抢连接池
            - Path=/admin/stat/**
        - id: legacy
          uri: ${LEGACY_URI:http://localhost:9000}
          order: 6
          predicates:
            # 创作助手和文件上传还没拆，先留在原服务
            - Path=/author/ai/**,/file/**
  web:
    resources:
      # 静态页在网关托管，页面里都是相对路径，根目录得指到这些文件的位置
      static-locations: classpath:/static/

file:
  # 跟后端服务指向同一个目录，所以都取上一级
  upload-path: ${FILE_UPLOAD_PATH:../upload}
