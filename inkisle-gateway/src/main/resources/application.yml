server:
  port: 8080

spring:
  application:
    name: inkisle-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      # 外部请求带进来的这几个头一律剥掉：
      # X-Forwarded-For 会被限流和游客防重拿来当来源 IP，客户端自己填就等于每次换一个新身份；
      # X-Internal-Token 是服务间凭证，不能让外面伪造进来
      default-filters:
        - RemoveRequestHeader=X-Forwarded-For
        - RemoveRequestHeader=X-Real-IP
        - RemoveRequestHeader=Forwarded
        - RemoveRequestHeader=X-Internal-Token
      # 只转接口前缀，写成 /** 会把 html、css 也当接口转走，静态页就打不开了
      # 按前缀分服务，order 小的先匹配。/author 下面既有写书、写章节、AI 改写（归 book），
      # 也有登录注册（归 user），不排顺序会走错
      routes:
        - id: book-author
          uri: lb://inkisle-book
          order: 1
          predicates:
            - Path=/author/book/**,/author/chapter/**,/author/ai/**
        - id: audit
          uri: lb://inkisle-audit
          order: 2
          predicates:
            - Path=/admin/audit/**,/admin/chapter/**
        - id: book
          uri: lb://inkisle-book
          order: 3
          predicates:
            - Path=/book/**,/bookshelf/**,/chapter/**,/category/**,/comment/**,/history/**,/home/**,/rank/**,/rating/**,/admin/book/**,/admin/category/**,/admin/comment/**,/admin/home/**
        - id: user
          uri: lb://inkisle-user
          order: 4
          predicates:
            # /admin/info 是管理员自己的信息，之前漏了，走网关必然 404
            - Path=/user/**,/sign/**,/captcha/**,/author/**,/admin/login,/admin/info,/admin/author/**,/admin/user/**
        - id: stat
          uri: lb://inkisle-stat
          order: 5
          predicates:
            # 数据看板，只读聚合，独立进程，不跟业务服务抢连接池
            - Path=/admin/stat/**
  web:
    resources:
      # 静态页在网关托管，页面里都是相对路径，根目录得指到这些文件的位置
      static-locations: classpath:/static/
  webflux:
    multipart:
      # 封面图几百 KB，五兆足够，再大就落到临时文件，不占堆
      max-in-memory-size: 5MB

jwt:
  # 上传接口在网关验 token，所以网关也得有密钥
  secret: ${JWT_SECRET:inkisle-dev-secret-key-change-me-before-release}
  expire-hours: 24

file:
  # 跟后端服务指向同一个目录，所以都取上一级
  upload-path: ${FILE_UPLOAD_PATH:../upload}

inkisle:
  gateway:
    rate-limit:
      # 按来源 IP 限制接口请求。开发时浏览器一次页面会并发几个请求，
      # 阈值给低了会误伤自己的前端，20/40 是本地跑着不别扭、脚本刷又刷不动的档位
      qps: ${RATE_LIMIT_QPS:20}
      burst: ${RATE_LIMIT_BURST:40}
