<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>作者登录 - 墨屿小说</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-role="author">

<div class="auth-box">
    <h2>作者中心</h2>
    <div class="sub">登录后可以发布作品、管理章节</div>

    <div class="form-item">
        <input type="text" id="username" placeholder="作者账号" autocomplete="username">
    </div>
    <div class="form-item">
        <input type="password" id="password" placeholder="密码" autocomplete="current-password">
    </div>
    <div class="form-item captcha-row">
        <input type="text" id="captcha" placeholder="验证码" maxlength="4" autocomplete="off">
        <img id="captchaImg" alt="验证码" title="看不清，点一下换一张" onclick="refreshCaptcha()">
    </div>
    <div class="form-error" id="tip"></div>

    <button class="btn btn-primary btn-block" id="submitBtn" onclick="doLogin()">登 录</button>

    <div class="foot">还没有作者账号？<a href="author-register.html">去注册</a></div>
    <div class="foot" style="margin-top:8px;font-size:12px">
        <a href="login.html">读者入口</a> · <a href="admin-login.html">管理端</a>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    // 已经登录了就直接进后台
    if (Auth.logged()) {
        location.replace('author-home.html');
    }

    // 刷新验证码，拼接时间戳绕过缓存，否则 src 不变时图片不会重新请求
    function refreshCaptcha() {
        document.getElementById('captchaImg').src = 'captcha/image?t=' + Date.now();
    }
    refreshCaptcha();

    async function doLogin() {
        const tip = document.getElementById('tip');
        const btn = document.getElementById('submitBtn');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const captcha = document.getElementById('captcha').value.trim();

        if (!username || !password || !captcha) {
            tip.textContent = '账号、密码、验证码都要填';
            return;
        }

        btn.disabled = true;
        tip.textContent = '';
        try {
            const data = await post('/author/login', { username: username, password: password, captcha: captcha });
            Auth.save(data.token, data.author);
            toast('欢迎，' + (data.author.penName || data.author.username));
            setTimeout(function () { location.href = 'author-home.html'; }, 400);
        } catch (e) {
            tip.textContent = e.message;
            // 验证码一次性的，这次不管对错都作废了，得刷新再试
            refreshCaptcha();
            btn.disabled = false;
        }
    }

    document.getElementById('password').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doLogin();
    });
</script>
</body>
</html>
