<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>分类管理 - 墨屿小说</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 子分类靠左缩进，与一级分类区分开 */
        .cat-child .cat-name { padding-left: 28px; color: var(--ink-light); }
        .cat-child .cat-name::before { content: '└ '; }
    </style>
</head>
<body data-role="admin">

<div id="nav"></div>

<div class="layout">
    <div id="side"></div>

    <div class="main">
        <div class="page-title">分类管理 <small>仅支持两级；分类下还有作品或子分类时不能删除</small></div>

        <div class="filter-bar">
            <button class="btn btn-primary btn-sm" onclick="openCreate(0)">新增一级分类</button>
            <button class="btn btn-sm" onclick="load()">刷新</button>
        </div>

        <div id="list"><div class="loading">加载中...</div></div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    /** 当前分类树，弹窗里选父级与判断层级都用它 */
    let tree = [];

    if (setupBackend('category')) {
        load();
    }

    async function load() {
        const box = document.getElementById('list');
        box.innerHTML = '<div class="loading">加载中...</div>';
        try {
            tree = await get('/category/list') || [];
            if (!tree.length) {
                box.innerHTML = '<div class="empty">还没有分类，先新增一个一级分类</div>';
                return;
            }

            let html = '<table class="table"><thead><tr>'
                + '<th>分类名</th><th style="width:90px">排序</th><th style="width:90px">ID</th>'
                + '<th style="width:260px">操作</th>'
                + '</tr></thead><tbody>';

            tree.forEach(function (root) {
                html += rowHtml(root, false);
                (root.children || []).forEach(function (child) {
                    html += rowHtml(child, true);
                });
            });

            html += '</tbody></table>';
            box.innerHTML = html;
        } catch (e) {
            box.innerHTML = '<div class="empty">' + escapeHtml(e.message) + '</div>';
        }
    }

    function rowHtml(c, isChild) {
        return '<tr class="' + (isChild ? 'cat-child' : '') + '">'
            + '<td class="cat-name">' + escapeHtml(c.categoryName) + '</td>'
            + '<td>' + (c.sort === null || c.sort === undefined ? 0 : c.sort) + '</td>'
            + '<td>' + c.id + '</td>'
            + '<td>'
            + (isChild ? '' : '<button class="btn btn-sm" onclick="openCreate(' + c.id + ')">加子分类</button> ')
            + '<button class="btn btn-sm" onclick="openEdit(' + c.id + ')">编辑</button> '
            + '<button class="btn btn-danger btn-sm" onclick="remove(' + c.id + ')">删除</button>'
            + '</td></tr>';
    }

    /** 按 id 在树里找分类，同时返回它是否是一级 */
    function find(id) {
        for (let i = 0; i < tree.length; i++) {
            if (Number(tree[i].id) === Number(id)) return { item: tree[i], isRoot: true };
            const children = tree[i].children || [];
            for (let j = 0; j < children.length; j++) {
                if (Number(children[j].id) === Number(id)) return { item: children[j], isRoot: false };
            }
        }
        return null;
    }

    /**
     * 新增：parentId 为 0 表示一级分类
     * 父级下拉只列一级分类，从入口上就不给「挂到二级分类下」的机会
     */
    function openCreate(parentId) {
        const options = [{ id: 0, name: '（无，作为一级分类）', sort: '' }];
        tree.forEach(function (c) {
            options.push(c);
        });

        openForm({
            title: parentId === 0 ? '新增一级分类' : '新增子分类',
            name: '',
            sort: 0,
            parentId: parentId,
            lockParent: false,
            options: options,
            onSave: function (dto) {
                return post('/admin/category', dto);
            }
        });
    }

    function openEdit(id) {
        const hit = find(id);
        if (!hit) {
            toast('分类不存在，请刷新');
            return;
        }
        const c = hit.item;
        openForm({
            title: '编辑分类',
            name: c.categoryName,
            sort: c.sort || 0,
            parentId: c.parentId || 0,
            // 改父级会让整棵树移位，也容易把一级分类挂到自己的子分类下形成环，
            // 因此编辑时只允许改名称与排序
            lockParent: true,
            parentLabel: hit.isRoot ? '一级分类' : (parentName(c.parentId) + ' 的子分类'),
            onSave: function (dto) {
                return put('/admin/category/' + id, dto);
            }
        });
    }

    function parentName(parentId) {
        for (let i = 0; i < tree.length; i++) {
            if (Number(tree[i].id) === Number(parentId)) return tree[i].categoryName;
        }
        return '分类 #' + parentId;
    }

    function openForm(cfg) {
        const mask = document.createElement('div');
        mask.className = 'modal-mask';

        let parentArea;
        if (cfg.lockParent) {
            parentArea = '<div class="form-item"><label>上级</label>'
                + '<div style="padding:8px 0;color:var(--ink-light)">' + escapeHtml(cfg.parentLabel) + '</div></div>';
        } else {
            let opts = '';
            cfg.options.forEach(function (o) {
                const label = o.id === 0 ? o.name : o.categoryName;
                opts += '<option value="' + o.id + '"'
                    + (Number(o.id) === Number(cfg.parentId) ? ' selected' : '') + '>'
                    + escapeHtml(label) + '</option>';
            });
            parentArea = '<div class="form-item"><label>上级</label>'
                + '<select id="catParent">' + opts + '</select></div>';
        }

        mask.innerHTML = '<div class="modal">'
            + '<h3>' + escapeHtml(cfg.title) + '</h3>'
            + '<div class="form-item"><label>分类名</label>'
            + '<input type="text" id="catName" maxlength="50" value="' + escapeHtml(cfg.name) + '"></div>'
            + '<div class="form-item"><label>排序</label>'
            + '<input type="number" id="catSort" value="' + (cfg.sort || 0) + '">'
            + '<div class="form-tip">数字越小越靠前</div></div>'
            + parentArea
            + '<div class="form-error"></div>'
            + '<div class="modal-foot">'
            + '  <button class="btn" onclick="this.closest(\'.modal-mask\').remove()">取消</button>'
            + '  <button class="btn btn-primary">保存</button>'
            + '</div></div>';

        document.body.appendChild(mask);
        mask.querySelector('#catName').focus();

        const tip = mask.querySelector('.form-error');
        const okBtn = mask.querySelector('.modal-foot .btn:last-child');
        okBtn.onclick = async function () {
            const name = mask.querySelector('#catName').value.trim();
            if (!name) {
                tip.textContent = '分类名不能为空';
                return;
            }
            const sortVal = parseInt(mask.querySelector('#catSort').value, 10);
            const parentEl = mask.querySelector('#catParent');
            const dto = {
                categoryName: name,
                sort: isNaN(sortVal) ? 0 : sortVal,
                parentId: parentEl ? Number(parentEl.value) : Number(cfg.parentId || 0)
            };
            okBtn.disabled = true;
            try {
                await cfg.onSave(dto);
                mask.remove();
                toast('已保存');
                load();
            } catch (e) {
                tip.textContent = e.message;
                okBtn.disabled = false;
            }
        };
    }

    async function remove(id) {
        const hit = find(id);
        const name = hit ? hit.item.categoryName : ('#' + id);
        if (!confirm('确定删除分类「' + name + '」？')) return;
        try {
            await del('/admin/category/' + id);
            toast('已删除');
            load();
        } catch (e) {
            toast(e.message);
        }
    }
</script>
</body>
</html>
