<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>书籍审核 - 墨屿小说</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-role="admin">

<div id="nav"></div>

<div class="layout">
    <div id="side"></div>

    <div class="main">
        <div class="page-title" id="title">书籍审核</div>

        <!--
          前三个是审核记录，后两个是作品本身的状态。
          审核记录只管「送审的那一次」，书已经上架之后才出问题的，要从「已上架」里下架。
        -->
        <div class="filter-bar">
            <button class="btn btn-sm btn-primary" data-mode="pending" onclick="switchMode('pending', this)">待审核</button>
            <button class="btn btn-sm" data-mode="passed" onclick="switchMode('passed', this)">已通过</button>
            <button class="btn btn-sm" data-mode="rejected" onclick="switchMode('rejected', this)">已驳回</button>
            <button class="btn btn-sm" data-mode="online" onclick="switchMode('online', this)">已上架</button>
            <button class="btn btn-sm" data-mode="offline" onclick="switchMode('offline', this)">已下架</button>
        </div>

        <div id="list"><div class="loading">加载中...</div></div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    let mode = 'pending';

    const MODES = {
        pending: { url: '/admin/audit/list', params: { status: 0 } },
        passed: { url: '/admin/audit/list', params: { status: 1 } },
        rejected: { url: '/admin/audit/list', params: { status: 2 } },
        online: { url: '/admin/audit/books', params: { auditStatus: 2 } },
        offline: { url: '/admin/audit/books', params: { auditStatus: 4 } }
    };

    if (!setupBackend('audit')) {
        // setupBackend 未通过，已跳转登录页
    } else {
        load();
    }

    function switchMode(m, btn) {
        mode = m;
        document.querySelectorAll('.filter-bar .btn').forEach(function (b) { b.classList.remove('btn-primary'); });
        btn.classList.add('btn-primary');
        load();
    }

    async function load() {
        const box = document.getElementById('list');
        box.innerHTML = '<div class="loading">加载中...</div>';
        try {
            const m = MODES[mode];
            const data = await get(m.url, m.params);
            // 审核记录直接返回数组，作品列表返回 { list, total }
            const list = Array.isArray(data) ? data : ((data && data.list) || []);

            if (!list.length) {
                box.innerHTML = '<div class="empty">这个状态下没有记录</div>';
                return;
            }
            if (mode === 'online' || mode === 'offline') {
                renderBooks(list);
            } else {
                renderRecords(list);
            }
        } catch (e) {
            box.innerHTML = '<div class="empty">' + escapeHtml(e.message) + '</div>';
        }
    }

    /** 审核记录：待审的给通过 / 驳回，处理过的只显示结论 */
    function renderRecords(list) {
        let html = '<table class="table"><thead><tr>'
            + '<th>ID</th><th>书籍</th><th>作者ID</th><th>提交时间</th><th>审核时间</th><th>意见</th><th style="width:230px">操作</th>'
            + '</tr></thead><tbody>';

        list.forEach(function (r) {
            const canOperate = Number(r.status) === 0;
            html += '<tr>'
                + '<td>' + r.id + '</td>'
                + '<td>' + escapeHtml(r.bookName || ('书籍 #' + r.bookId)) + '</td>'
                + '<td>' + r.authorId + '</td>'
                + '<td>' + fmtTime(r.submitTime) + '</td>'
                + '<td>' + fmtTime(r.auditTime) + '</td>'
                + '<td>' + escapeHtml(r.remark || '-') + '</td>'
                + '<td>'
                + '<button class="btn btn-sm" onclick="preview(' + r.bookId + ')">查看内容</button> '
                + (canOperate
                    ? '<button class="btn btn-sm btn-success" onclick="pass(' + r.id + ')">通过</button> '
                      + '<button class="btn btn-sm btn-danger" onclick="reject(' + r.id + ')">驳回</button>'
                    : auditStatusTag(r.status))
                + '</td>'
                + '</tr>';
        });

        document.getElementById('list').innerHTML = html + '</tbody></table>';
    }

    /** 作品本身：已上架的可下架，已下架的可恢复 */
    function renderBooks(list) {
        const offline = mode === 'offline';
        let html = '<table class="table"><thead><tr>'
            + '<th>ID</th><th>书名</th><th>作者</th><th>更新时间</th><th>审核意见</th><th style="width:300px">操作</th>'
            + '</tr></thead><tbody>';

        list.forEach(function (b) {
            html += '<tr>'
                + '<td>' + b.id + '</td>'
                + '<td>' + escapeHtml(b.bookName) + '</td>'
                + '<td>' + escapeHtml(b.authorName || '-') + '</td>'
                + '<td>' + fmtTime(b.updateTime) + '</td>'
                + '<td>' + escapeHtml(b.auditRemark || '-') + '</td>'
                + '<td>'
                + '<button class="btn btn-sm" onclick="preview(' + b.id + ')">查看内容</button> '
                + (offline
                    ? '<button class="btn btn-sm btn-success" onclick="restore(' + b.id + ')">恢复上架</button> '
                    : '<button class="btn btn-sm btn-danger" onclick="takeDown(' + b.id + ')">下架</button> ')
                + '<button class="btn btn-sm" onclick="removeBook(' + b.id + ')">删除</button>'
                + '</td>'
                + '</tr>';
        });

        document.getElementById('list').innerHTML = html + '</tbody></table>';
    }

    async function pass(id) {
        try {
            await post('/admin/audit/pass', { id: id });
            toast('已通过');
            load();
        } catch (e) {
            toast(e.message);
        }
    }

    function reject(id) {
        openRemarkModal('驳回原因', '写清楚为什么驳回，作者能看到', '确认驳回', 'btn-danger', async function (remark) {
            await post('/admin/audit/reject', { id: id, remark: remark });
            toast('已驳回');
        });
    }

    function takeDown(bookId) {
        openRemarkModal('下架原因', '写清楚为什么下架，作者能看到', '确认下架', 'btn-danger', async function (remark) {
            await post('/admin/audit/take-down', { bookId: bookId, remark: remark });
            toast('已下架');
        });
    }

    async function restore(bookId) {
        if (!confirm('恢复后这本书会立刻重新对读者可见，确定？')) return;
        try {
            await post('/admin/audit/restore', { bookId: bookId });
            toast('已恢复上架');
            load();
        } catch (e) {
            toast(e.message);
        }
    }

    /**
     * 删除是硬删，章节、正文、评论、评分、推荐位都会一起清掉
     * 下架只是让读者看不到，数据还在；两件事分开，别让管理员误以为下架等于删除
     */
    async function removeBook(bookId) {
        if (!confirm('删除后这本书的章节、正文、评论、评分与推荐位都会一并删除，且无法恢复。确定删除？')) return;
        try {
            await del('/admin/book/' + bookId);
            toast('已删除');
            load();
        } catch (e) {
            toast(e.message);
        }
    }

    /** 驳回与下架都需要填原因，弹层结构一致，抽出来复用 */
    function openRemarkModal(title, placeholder, confirmText, confirmClass, onConfirm) {
        const mask = document.createElement('div');
        mask.className = 'modal-mask';
        mask.innerHTML = '<div class="modal">'
            + '<h3>' + title + '</h3>'
            + '<div class="form-item"><textarea rows="3" placeholder="' + placeholder + '"></textarea></div>'
            + '<div class="form-error"></div>'
            + '<div class="modal-foot">'
            + '  <button class="btn" onclick="this.closest(\'.modal-mask\').remove()">取消</button>'
            + '  <button class="btn ' + confirmClass + '">' + confirmText + '</button>'
            + '</div></div>';
        document.body.appendChild(mask);

        const textarea = mask.querySelector('textarea');
        const tip = mask.querySelector('.form-error');
        const okBtn = mask.querySelector('.modal-foot .btn:last-child');
        textarea.focus();

        okBtn.onclick = async function () {
            const remark = textarea.value.trim();
            if (!remark) {
                tip.textContent = '原因不能不填';
                return;
            }
            okBtn.disabled = true;
            try {
                await onConfirm(remark);
                mask.remove();
                load();
            } catch (e) {
                tip.textContent = e.message;
                okBtn.disabled = false;
            }
        };
    }

    /**
     * 稿件预览：左边目录，右边正文
     * 待审作品在读者端是打不开的，审核员只能从这里看内容
     */
    async function preview(bookId) {
        try {
            const data = await get('/admin/audit/preview', { bookId: bookId });
            const book = data.book || {};
            const chapters = data.chapters || [];

            const side = chapters.length
                ? chapters.map(function (c) {
                    return '<div class="preview-chapter" data-chapter="' + c.id + '" onclick="loadChapter(this, '
                        + bookId + ',' + c.id + ')">'
                        + '<span class="num">' + c.chapterNum + '</span>'
                        + '<span class="name">' + escapeHtml(c.chapterName) + '</span></div>';
                }).join('')
                : '<div class="empty">这本书还没有章节</div>';

            const mask = document.createElement('div');
            mask.className = 'modal-mask';
            mask.onclick = function (e) { if (e.target === mask) mask.remove(); };
            mask.innerHTML = '<div class="modal modal-lg">'
                + '<h3>' + escapeHtml(book.bookName || '稿件预览') + '</h3>'
                + '<div class="preview-meta">共 ' + chapters.length + ' 章 · '
                + (book.auditRemark ? '上次意见：' + escapeHtml(book.auditRemark) : '暂无审核意见') + '</div>'
                + '<div class="preview-wrap">'
                + '  <div class="preview-side">' + side + '</div>'
                + '  <div class="preview-content" id="previewContent">从左侧选一章查看正文</div>'
                + '</div>'
                + '<div class="modal-foot"><button class="btn" onclick="this.closest(\'.modal-mask\').remove()">关闭</button></div>'
                + '</div>';
            document.body.appendChild(mask);
        } catch (e) {
            toast(e.message);
        }
    }

    async function loadChapter(el, bookId, chapterId) {
        const box = document.getElementById('previewContent');
        document.querySelectorAll('.preview-chapter').forEach(function (n) { n.classList.remove('active'); });
        el.classList.add('active');
        box.textContent = '加载中...';
        try {
            // 正文来自用户输入，用 textContent 写入，不拼 HTML
            box.textContent = (await get('/admin/audit/chapter', { bookId: bookId, chapterId: chapterId })) || '（本章没有正文）';
            box.scrollTop = 0;
        } catch (e) {
            box.textContent = e.message;
        }
    }
</script>
</body>
</html>
