<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>个人中心 - 墨屿小说</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile { display: flex; align-items: center; gap: 20px; }
        .avatar {
            width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, #409eff, #7ab8ff); color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
        }
    </style>
</head>
<body data-role="reader">

<div id="nav"></div>

<div class="container narrow">
    <div class="card">
        <div class="profile">
            <div class="avatar" id="avatar">书</div>
            <div class="grow">
                <div class="page-title" style="margin:0;font-size:18px" id="nick">-</div>
                <div style="color:#8c9aa8;font-size:13px" id="account">-</div>
                <button class="btn btn-sm" style="margin-top:6px" onclick="document.getElementById('avatarFile').click()">更换头像</button>
                <input type="file" id="avatarFile" accept="image/jpeg,image/png,image/gif,image/webp"
                       style="display:none" onchange="uploadAvatar(this)">
            </div>
            <div style="text-align:right">
                <div style="font-size:22px;font-weight:600;color:var(--primary)" id="signDays">0</div>
                <div style="color:#8c9aa8;font-size:12px">连续签到</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="page-title" style="font-size:16px">账号设置</div>
        <table class="table">
            <tbody>
            <tr><th style="width:110px">用户 ID</th><td id="uid">-</td></tr>
            <tr><th>昵称</th><td><input class="edit-input" id="editNick" maxlength="50"></td></tr>
            <tr><th>手机号</th><td><input class="edit-input" id="editPhone" maxlength="20" placeholder="选填"></td></tr>
            <tr><th>邮箱</th><td><input class="edit-input" id="editEmail" maxlength="100" placeholder="选填"></td></tr>
            <tr><th>注册时间</th><td id="createTime">-</td></tr>
            </tbody>
        </table>
        <div style="margin-top:16px">
            <button class="btn btn-primary btn-sm" onclick="saveProfile()">保存资料</button>
            <button class="btn btn-danger btn-sm" onclick="Auth.logout()">退出登录</button>
        </div>
    </div>

    <div class="card">
        <div class="page-title" style="font-size:16px">修改密码</div>
        <table class="table">
            <tbody>
            <tr><th style="width:110px">原密码</th><td><input class="edit-input" type="password" id="oldPwd" placeholder="当前密码"></td></tr>
            <tr><th>新密码</th><td><input class="edit-input" type="password" id="newPwd" placeholder="6-20 位"></td></tr>
            <tr><th>确认新密码</th><td><input class="edit-input" type="password" id="newPwd2" placeholder="再输一次"></td></tr>
            </tbody>
        </table>
        <div style="margin-top:16px">
            <button class="btn btn-sm" onclick="changePassword()">修改密码</button>
        </div>
    </div>

    <div class="card">
        <div class="page-title" style="font-size:16px">我的评论</div>
        <div id="comments"><div class="loading">加载中...</div></div>
        <div class="pager" id="commentPager"></div>
    </div>

    <div class="card">
        <div class="page-title" style="font-size:16px">阅读记录</div>
        <div id="history"><div class="loading">加载中...</div></div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    readerNav('user');

    if (!Auth.require('user.html')) {
        // 未登录时 require() 已跳转登录页
    } else {
        load();
    }

    let me = null;

    async function load() {
        try {
            const u = await get('/user/info');
            me = u;
            document.title = (u.nickName || u.username) + ' - 个人中心';
            document.getElementById('nick').textContent = u.nickName || u.username;
            document.getElementById('account').textContent = '账号：' + u.username;
            document.getElementById('uid').textContent = u.id;
            document.getElementById('createTime').textContent = fmtTime(u.createTime);
            // 表单回填的是当前值，留空与未填在接口层都会存成 null
            document.getElementById('editNick').value = u.nickName || '';
            document.getElementById('editPhone').value = u.phone || '';
            document.getElementById('editEmail').value = u.email || '';
            renderAvatar(u.avatar, u.nickName || u.username);

            loadSignDays(u.id);
            loadHistory();
            loadComments();
        } catch (e) {
            toast(e.message);
        }
    }

    /** 有头像就铺成背景图，没有就用昵称首字占位 */
    function renderAvatar(url, name) {
        const el = document.getElementById('avatar');
        if (url) {
            el.style.backgroundImage = 'url(' + encodeURI(url) + ')';
            el.style.backgroundSize = 'cover';
            el.style.backgroundPosition = 'center';
            el.textContent = '';
        } else {
            el.style.backgroundImage = '';
            el.textContent = (name || '书').slice(0, 1);
        }
    }

    /* ---------------- 账号设置 ---------------- */
    async function saveProfile() {
        const nickName = document.getElementById('editNick').value.trim();
        if (!nickName) {
            toast('昵称不能为空');
            return;
        }
        try {
            const u = await put('/user/profile', {
                nickName: nickName,
                phone: document.getElementById('editPhone').value.trim(),
                email: document.getElementById('editEmail').value.trim(),
                avatar: (me && me.avatar) || ''
            });
            me = u;
            document.getElementById('nick').textContent = u.nickName || u.username;
            document.title = (u.nickName || u.username) + ' - 个人中心';
            // 导航栏读的是本地缓存里的昵称，不更新的话要刷新页面才会变
            const cached = Auth.user() || {};
            cached.nickName = u.nickName;
            Auth.save(Auth.token(), cached);
            toast('资料已保存');
        } catch (e) {
            toast(e.message);
        }
    }

    /**
     * 头像先走通用上传接口拿 URL，再随资料一起保存
     * 上传接口返回的是 /upload/yyyy/MM/dd/xxx 这种站内路径，直接存进 avatar 即可
     */
    async function uploadAvatar(input) {
        const file = input.files && input.files[0];
        if (!file) return;
        const form = new FormData();
        form.append('file', file);
        try {
            const data = await request('/file/upload', { method: 'POST', body: form });
            const avatar = data.url;
            await put('/user/profile', {
                nickName: (me && me.nickName) || '',
                phone: (me && me.phone) || '',
                email: (me && me.email) || '',
                avatar: avatar
            });
            me.avatar = avatar;
            renderAvatar(avatar, me.nickName);
            toast('头像已更新');
        } catch (e) {
            toast(e.message);
        }
        // 清空选择，否则选同一张图不会触发 change
        input.value = '';
    }

    async function changePassword() {
        const oldPassword = document.getElementById('oldPwd').value;
        const newPassword = document.getElementById('newPwd').value;
        const confirm = document.getElementById('newPwd2').value;
        if (!oldPassword || !newPassword) {
            toast('请把密码填完整');
            return;
        }
        if (newPassword.length < 6 || newPassword.length > 20) {
            toast('新密码长度要在 6 到 20 之间');
            return;
        }
        if (newPassword !== confirm) {
            toast('两次输入的新密码不一致');
            return;
        }
        try {
            await put('/user/password', { oldPassword: oldPassword, newPassword: newPassword });
            document.getElementById('oldPwd').value = '';
            document.getElementById('newPwd').value = '';
            document.getElementById('newPwd2').value = '';
            toast('密码已修改');
        } catch (e) {
            toast(e.message);
        }
    }

    async function loadSignDays() {
        try {
            const days = await get('/sign/continuous');
            document.getElementById('signDays').textContent = days || 0;
        } catch (e) { /* 签到天数获取失败时留空，不影响查看资料 */ }
    }

    async function loadHistory() {
        const box = document.getElementById('history');
        try {
            // userId 由后端从 token 解析，前端无需也不应传递
            const list = await get('/history/list');
            if (!list || !list.length) {
                box.innerHTML = '<div class="empty">还没有阅读记录</div>';
                return;
            }
            let html = '';
            list.forEach(function (h) {
                html += '<div class="list-item">'
                    + '<div class="grow">'
                    + '  <div class="title">' + escapeHtml(h.bookName || ('书籍 #' + h.bookId)) + '</div>'
                    + '  <div class="meta">读到第 ' + (h.chapterNum || 0) + ' 章 · ' + fmtTime(h.updateTime) + '</div>'
                    + '</div>'
                    + '<button class="btn btn-sm" onclick="location.href=\'read.html?chapterId=' + h.chapterId + '\'">继续读</button>'
                    + '</div>';
            });
            box.innerHTML = html;
        } catch (e) {
            box.innerHTML = '<div class="empty">' + escapeHtml(e.message) + '</div>';
        }
    }

    /* ---------------- 我的评论 ---------------- */
    const commentState = { pageNum: 1, pageSize: 5, editingId: null, list: [] };

    async function loadComments() {
        const box = document.getElementById('comments');
        try {
            const data = await get('/comment/mine', {
                pageNum: commentState.pageNum, pageSize: commentState.pageSize
            });
            const list = data.list || [];
            commentState.list = list;
            if (!list.length) {
                box.innerHTML = '<div class="empty">还没有发过评论</div>';
                document.getElementById('commentPager').innerHTML = '';
                return;
            }

            let html = '';
            list.forEach(function (c) {
                const editing = commentState.editingId === c.id;
                html += '<div class="list-item">'
                    + '<div class="grow">'
                    + '  <div class="title">' + escapeHtml(c.bookName || ('书籍 #' + c.bookId)) + '</div>';
                if (editing) {
                    html += '<textarea id="edit-' + c.id + '" rows="3" style="width:100%;margin:6px 0;padding:8px;'
                        + 'border:1px solid var(--border);border-radius:6px;font:inherit">' + escapeHtml(c.content) + '</textarea>';
                } else {
                    html += '<div style="margin:4px 0">' + escapeHtml(c.content) + '</div>';
                }
                html += '  <div class="meta">' + fmtTime(c.createTime) + '</div>'
                    + '</div>';
                if (editing) {
                    html += '<button class="btn btn-primary btn-sm" onclick="saveComment(' + c.id + ')">保存</button>'
                        + '<button class="btn btn-sm" onclick="cancelEdit()">取消</button>';
                } else {
                    html += '<button class="btn btn-sm" onclick="editComment(' + c.id + ')">编辑</button>'
                        + '<button class="btn btn-danger btn-sm" onclick="deleteComment(' + c.id + ')">删除</button>';
                }
                html += '</div>';
            });
            box.innerHTML = html;
            renderCommentPager(data.total);
        } catch (e) {
            box.innerHTML = '<div class="empty">' + escapeHtml(e.message) + '</div>';
        }
    }

    function renderCommentPager(total) {
        const pages = Math.max(1, Math.ceil((total || 0) / commentState.pageSize));
        document.getElementById('commentPager').innerHTML =
            '<button onclick="goCommentPage(' + (commentState.pageNum - 1) + ')" '
            + (commentState.pageNum <= 1 ? 'disabled' : '') + '>上一页</button>'
            + '<span>第 ' + commentState.pageNum + ' / ' + pages + ' 页 · 共 ' + (total || 0) + ' 条</span>'
            + '<button onclick="goCommentPage(' + (commentState.pageNum + 1) + ')" '
            + (commentState.pageNum >= pages ? 'disabled' : '') + '>下一页</button>';
    }

    function goCommentPage(n) {
        commentState.pageNum = n;
        commentState.editingId = null;
        loadComments();
    }

    function editComment(id) {
        commentState.editingId = id;
        loadComments();
    }

    function cancelEdit() {
        commentState.editingId = null;
        loadComments();
    }

    async function saveComment(id) {
        const el = document.getElementById('edit-' + id);
        const text = el ? el.value.trim() : '';
        if (!text) {
            toast('评论不能为空');
            return;
        }
        try {
            await put('/comment/' + id, { content: text });
            commentState.editingId = null;
            toast('已保存');
            loadComments();
        } catch (e) {
            toast(e.message);
        }
    }

    async function deleteComment(id) {
        if (!confirm('确定删除这条评论？删除后无法恢复')) return;
        try {
            await del('/comment/' + id);
            toast('已删除');
            // 删掉的是当前页最后一条时向前翻一页，否则会停在空页
            if (commentState.list.length === 1 && commentState.pageNum > 1) {
                commentState.pageNum--;
            }
            loadComments();
        } catch (e) {
            toast(e.message);
        }
    }
</script>
</body>
</html>
