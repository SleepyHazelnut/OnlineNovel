<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>个人中心 - 墨屿小说</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile { display: flex; align-items: center; gap: 20px; }
        .avatar {
            width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0;
            background: linear-gradient(135deg, #409eff, #7ab8ff); color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
        }
    </style>
</head>
<body data-role="reader">

<div id="nav"></div>

<div class="container narrow">
    <div class="card">
        <div class="profile">
            <div class="avatar" id="avatar">书</div>
            <div class="grow">
                <div class="page-title" style="margin:0;font-size:18px" id="nick">-</div>
                <div style="color:#8c9aa8;font-size:13px" id="account">-</div>
            </div>
            <div style="text-align:right">
                <div style="font-size:22px;font-weight:600;color:var(--primary)" id="signDays">0</div>
                <div style="color:#8c9aa8;font-size:12px">连续签到</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="page-title" style="font-size:16px">资料</div>
        <table class="table">
            <tbody>
            <tr><th style="width:110px">用户 ID</th><td id="uid">-</td></tr>
            <tr><th>昵称</th><td id="nick2">-</td></tr>
            <tr><th>手机号</th><td id="phone">-</td></tr>
            <tr><th>邮箱</th><td id="email">-</td></tr>
            <tr><th>注册时间</th><td id="createTime">-</td></tr>
            </tbody>
        </table>
        <div style="margin-top:16px">
            <button class="btn btn-danger btn-sm" onclick="Auth.logout()">退出登录</button>
        </div>
    </div>

    <div class="card">
        <div class="page-title" style="font-size:16px">我的评论</div>
        <div id="comments"><div class="loading">加载中...</div></div>
        <div class="pager" id="commentPager"></div>
    </div>

    <div class="card">
        <div class="page-title" style="font-size:16px">阅读记录</div>
        <div id="history"><div class="loading">加载中...</div></div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    readerNav('user');

    if (!Auth.require('user.html')) {
        // 未登录时 require() 已跳转登录页
    } else {
        load();
    }

    async function load() {
        try {
            const u = await get('/user/info');
            document.title = (u.nickName || u.username) + ' - 个人中心';
            document.getElementById('avatar').textContent = (u.nickName || u.username || '书').slice(0, 1);
            document.getElementById('nick').textContent = u.nickName || u.username;
            document.getElementById('account').textContent = '账号：' + u.username;
            document.getElementById('uid').textContent = u.id;
            document.getElementById('nick2').textContent = u.nickName || '-';
            document.getElementById('phone').textContent = u.phone || '未填';
            document.getElementById('email').textContent = u.email || '未填';
            document.getElementById('createTime').textContent = fmtTime(u.createTime);

            loadSignDays(u.id);
            loadHistory();
            loadComments();
        } catch (e) {
            toast(e.message);
        }
    }

    async function loadSignDays() {
        try {
            const days = await get('/sign/continuous');
            document.getElementById('signDays').textContent = days || 0;
        } catch (e) { /* 签到天数获取失败时留空，不影响查看资料 */ }
    }

    async function loadHistory() {
        const box = document.getElementById('history');
        try {
            // userId 由后端从 token 解析，前端无需也不应传递
            const list = await get('/history/list');
            if (!list || !list.length) {
                box.innerHTML = '<div class="empty">还没有阅读记录</div>';
                return;
            }
            let html = '';
            list.forEach(function (h) {
                html += '<div class="list-item">'
                    + '<div class="grow">'
                    + '  <div class="title">' + escapeHtml(h.bookName || ('书籍 #' + h.bookId)) + '</div>'
                    + '  <div class="meta">读到第 ' + (h.chapterNum || 0) + ' 章 · ' + fmtTime(h.updateTime) + '</div>'
                    + '</div>'
                    + '<button class="btn btn-sm" onclick="location.href=\'read.html?chapterId=' + h.chapterId + '\'">继续读</button>'
                    + '</div>';
            });
            box.innerHTML = html;
        } catch (e) {
            box.innerHTML = '<div class="empty">' + escapeHtml(e.message) + '</div>';
        }
    }

    /* ---------------- 我的评论 ---------------- */
    const commentState = { pageNum: 1, pageSize: 5, editingId: null, list: [] };

    async function loadComments() {
        const box = document.getElementById('comments');
        try {
            const data = await get('/comment/mine', {
                pageNum: commentState.pageNum, pageSize: commentState.pageSize
            });
            const list = data.list || [];
            commentState.list = list;
            if (!list.length) {
                box.innerHTML = '<div class="empty">还没有发过评论</div>';
                document.getElementById('commentPager').innerHTML = '';
                return;
            }

            let html = '';
            list.forEach(function (c) {
                const editing = commentState.editingId === c.id;
                html += '<div class="list-item">'
                    + '<div class="grow">'
                    + '  <div class="title">' + escapeHtml(c.bookName || ('书籍 #' + c.bookId)) + '</div>';
                if (editing) {
                    html += '<textarea id="edit-' + c.id + '" rows="3" style="width:100%;margin:6px 0;padding:8px;'
                        + 'border:1px solid var(--border);border-radius:6px;font:inherit">' + escapeHtml(c.content) + '</textarea>';
                } else {
                    html += '<div style="margin:4px 0">' + escapeHtml(c.content) + '</div>';
                }
                html += '  <div class="meta">' + fmtTime(c.createTime) + '</div>'
                    + '</div>';
                if (editing) {
                    html += '<button class="btn btn-primary btn-sm" onclick="saveComment(' + c.id + ')">保存</button>'
                        + '<button class="btn btn-sm" onclick="cancelEdit()">取消</button>';
                } else {
                    html += '<button class="btn btn-sm" onclick="editComment(' + c.id + ')">编辑</button>'
                        + '<button class="btn btn-danger btn-sm" onclick="deleteComment(' + c.id + ')">删除</button>';
                }
                html += '</div>';
            });
            box.innerHTML = html;
            renderCommentPager(data.total);
        } catch (e) {
            box.innerHTML = '<div class="empty">' + escapeHtml(e.message) + '</div>';
        }
    }

    function renderCommentPager(total) {
        const pages = Math.max(1, Math.ceil((total || 0) / commentState.pageSize));
        document.getElementById('commentPager').innerHTML =
            '<button onclick="goCommentPage(' + (commentState.pageNum - 1) + ')" '
            + (commentState.pageNum <= 1 ? 'disabled' : '') + '>上一页</button>'
            + '<span>第 ' + commentState.pageNum + ' / ' + pages + ' 页 · 共 ' + (total || 0) + ' 条</span>'
            + '<button onclick="goCommentPage(' + (commentState.pageNum + 1) + ')" '
            + (commentState.pageNum >= pages ? 'disabled' : '') + '>下一页</button>';
    }

    function goCommentPage(n) {
        commentState.pageNum = n;
        commentState.editingId = null;
        loadComments();
    }

    function editComment(id) {
        commentState.editingId = id;
        loadComments();
    }

    function cancelEdit() {
        commentState.editingId = null;
        loadComments();
    }

    async function saveComment(id) {
        const el = document.getElementById('edit-' + id);
        const text = el ? el.value.trim() : '';
        if (!text) {
            toast('评论不能为空');
            return;
        }
        try {
            await put('/comment/' + id, { content: text });
            commentState.editingId = null;
            toast('已保存');
            loadComments();
        } catch (e) {
            toast(e.message);
        }
    }

    async function deleteComment(id) {
        if (!confirm('确定删除这条评论？删除后无法恢复')) return;
        try {
            await del('/comment/' + id);
            toast('已删除');
            // 删掉的是当前页最后一条时向前翻一页，否则会停在空页
            if (commentState.list.length === 1 && commentState.pageNum > 1) {
                commentState.pageNum--;
            }
            loadComments();
        } catch (e) {
            toast(e.message);
        }
    }
</script>
</body>
</html>
