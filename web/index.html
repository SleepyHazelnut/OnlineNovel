<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>书库 - 墨屿小说</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-role="reader">

<div id="nav"></div>

<div class="container">

    <div class="filter-bar">
        <input type="text" id="kw" placeholder="搜书名 / 作者名" style="width: 220px">
        <button class="btn btn-primary" onclick="doSearch()">搜索</button>
        <button class="btn" id="resetBtn" onclick="resetSearch()" style="display:none">返回全部</button>
        <div class="spacer grow"></div>
        <div class="cat-list" id="cats"></div>
    </div>

    <div id="result"></div>
    <div class="pager" id="pager"></div>

</div>

<script src="js/api.js"></script>
<script>
    readerNav('index');

    const state = { pageNum: 1, pageSize: 12, categoryId: null, keyword: '' };

    // 分类树只在第一次进来时拉一次，之后翻页、搜索都不再重复请求
    let catsLoaded = false;
    async function loadCats() {
        if (catsLoaded) return;
        try {
            const tree = await get('/category/list');
            let html = '<span class="cat active" data-id="" onclick="pickCat(this, null)">全部</span>';
            (tree || []).forEach(function (c) {
                html += '<span class="cat" data-id="' + c.id + '" onclick="pickCat(this, ' + c.id + ')">'
                    + escapeHtml(c.categoryName) + '</span>';
                (c.children || []).forEach(function (sub) {
                    html += '<span class="cat" data-id="' + sub.id + '" onclick="pickCat(this, ' + sub.id + ')">'
                        + escapeHtml(sub.categoryName) + '</span>';
                });
            });
            document.getElementById('cats').innerHTML = html;
            catsLoaded = true;
        } catch (e) {
            toast(e.message);
        }
    }

    function pickCat(el, id) {
        $all('.cat').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        state.categoryId = id;
        state.keyword = '';
        document.getElementById('kw').value = '';
        document.getElementById('resetBtn').style.display = 'none';
        state.pageNum = 1;
        load();
    }

    function doSearch() {
        const kw = document.getElementById('kw').value.trim();
        if (!kw) { toast('先输入要搜的词'); return; }
        state.keyword = kw;
        state.categoryId = null;
        $all('.cat').forEach(c => c.classList.remove('active'));
        document.querySelector('.cat[data-id=""]').classList.add('active');
        document.getElementById('resetBtn').style.display = '';
        state.pageNum = 1;
        load();
    }

    function resetSearch() {
        state.keyword = '';
        state.categoryId = null;
        state.pageNum = 1;
        document.getElementById('kw').value = '';
        document.getElementById('resetBtn').style.display = 'none';
        $all('.cat').forEach(c => c.classList.remove('active'));
        document.querySelector('.cat[data-id=""]').classList.add('active');
        load();
    }

    async function load() {
        const box = document.getElementById('result');
        box.innerHTML = '<div class="loading">加载中...</div>';
        try {
            let data;
            if (state.keyword) {
                data = await get('/book/search', {
                    keyword: state.keyword, pageNum: state.pageNum, pageSize: state.pageSize
                });
            } else {
                data = await get('/book/list', {
                    pageNum: state.pageNum, pageSize: state.pageSize, categoryId: state.categoryId
                });
            }

            const list = data.list || [];
            if (!list.length) {
                box.innerHTML = '<div class="empty">没有找到书</div>';
                document.getElementById('pager').innerHTML = '';
                return;
            }

            let html = '<div class="book-grid">';
            list.forEach(function (b) {
                html += '<div class="book-card" onclick="location.href=\'book.html?id=' + b.id + '\'">'
                    + '<div class="cover" style="' + coverStyle(b.coverUrl, b.bookName) + '">'
                    + coverText(b.coverUrl, b.bookName) + '</div>'
                    + '<div class="info">'
                    + '<div class="name">' + escapeHtml(b.bookName) + '</div>'
                    + '<div class="author">' + escapeHtml(b.authorName || '佚名') + '</div>'
                    + '<div class="desc">' + escapeHtml(b.bookDesc || '这本书还没有简介') + '</div>'
                    + '</div></div>';
            });
            html += '</div>';
            box.innerHTML = html;

            renderPager(data.total);
        } catch (e) {
            box.innerHTML = '<div class="empty">' + escapeHtml(e.message) + '</div>';
        }
    }

    function renderPager(total) {
        const pages = Math.max(1, Math.ceil((total || 0) / state.pageSize));
        const p = document.getElementById('pager');
        p.innerHTML = '<button onclick="goPage(' + (state.pageNum - 1) + ')" ' + (state.pageNum <= 1 ? 'disabled' : '') + '>上一页</button>'
            + '<span>第 ' + state.pageNum + ' / ' + pages + ' 页 · 共 ' + (total || 0) + ' 本</span>'
            + '<button onclick="goPage(' + (state.pageNum + 1) + ')" ' + (state.pageNum >= pages ? 'disabled' : '') + '>下一页</button>';
    }

    function goPage(n) {
        state.pageNum = n;
        load();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 支持回车触发搜索，免去每次点击按钮
    document.getElementById('kw').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doSearch();
    });

    loadCats();
    load();
</script>
</body>
</html>
