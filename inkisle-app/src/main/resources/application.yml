server:
  # 对外由网关收敛到 8080，这里不再直接暴露
  port: 9000

spring:
  application:
    name: inkisle-app
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  datasource:
    url: jdbc:mysql://localhost:3306/inkisle?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 封面图几百 KB 就够，但整本 txt 导入可能十几兆，统一放宽到 20M
      max-file-size: 20MB
      max-request-size: 25MB
  ai:
    openai:
      # DeepSeek 给的是 OpenAI 兼容接口，换个 base-url 就能直接连
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      # key 只从环境变量读，绝不写进仓库
      api-key: ${AI_API_KEY:sk-set-your-own-key-in-env}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          # 写东西要有点发挥，别太刻板
          temperature: 0.8
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      # 本地 redis 没设密码，连不上就快点报错，别让请求一直挂着
      timeout: 3s

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.inkisle.entity
  configuration:
    # 数据库下划线字段自动映射成驼峰属性
    map-underscore-to-camel-case: true

jwt:
  # 换环境记得覆盖，HS256 要求密钥长度不少于 32 字节
  secret: ${JWT_SECRET:inkisle-dev-secret-key-change-me-before-release}
  # token 有效期，单位小时
  expire-hours: 24

file:
  # 上传文件落盘目录，里面按 yyyy/MM/dd 分子目录
  upload-path: ${FILE_UPLOAD_PATH:./upload}
